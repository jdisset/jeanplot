# Side-by-side ground-truth / prediction pair.

<<(<): !include pkg:jeanplot:resources/templates/auto_panel
<<(<): !include pkg:jeanplot:resources/themes/plots

!require ground_truth_data: "PlotData (ground truth)"
!require predicted_data: "PlotData (predictions)"
!set_default file_prefix: ""
!set_default file_suffix: "_combined_pred.pdf"
!set_default output_dir: "./"
!set_default gt_title: "Ground Truth"
!set_default pred_title: "Predictions"

figure: !Figure
  theme: !include pkg:jeanplot:resources/themes/plots.yaml@rules
  output_dir: ${output_dir}
  output_file: !default_output_name
    plot_data: ${predicted_data}
    fallback: "pred"
    prefix: ${file_prefix}
    suffix: ${file_suffix}
  layout: !LayoutConstraints
    direction: row
    gap: 8
  children:
    - !AutoPanel
      plot_data: ${ground_truth_data}
      title: ${gt_title}
    - !AutoPanel
      plot_data: ${predicted_data}
      title: ${pred_title}
