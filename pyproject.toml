[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jeanplot"
authors = [{name = "Jean Disset", email = "jdisset@mit.edu"}]
version = "0.1.0"
description = "A gene circuit plotting library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "dracon",
    "matplotlib",
    "numpy",
	"lxml",
    "pydantic>=2.0",
    "svgpath2mpl",
]

[project.scripts]
jeanplot = "jeanplot.cli:main"
jeanplot-plot = "jeanplot.cli:PlotJob.cli"

[tool.hatch.build.targets.wheel]
packages = ["jeanplot"]

[tool.pyright]
reportMissingImports = true
reportMissingTypeStubs = false
typeCheckingMode = "off"

[tool.ruff]
line-length = 100
target-version = "py311"
