!noconstruct theme_vars: &tvars
  # --- Input Marker Colors (used in SVG files) ---
  input_main_marker_color: &input_main "#0000ff" # blue
  input_secondary_marker_color: &input_sec "#00ff00" # green

  # --- Output Theme Colors ---
  fluo_colors: &fcolors
    red: { dark: "#840137", base: "#ef957d", light: "#ffe5de", "bright": "#FF2C4944" }
    green: { dark: "#0e633a", base: "#6ccb83", light: "#efffdd", "bright": "#0EFF7377" }
    blue: { dark: "#006394", base: "#6cafc3", light: "#f3fafd", "bright": "#1AD5FF60" }
    yellow: { dark: "#9b6600", base: "#fad26d", light: "#fff888", "bright": "#FFC83Caa" }
    ir: { dark: "#6c1772", base: "#df9ae4", light: "#ffe7f4", "bright": "#FF82FCaa" }
    maroon: { dark: "#734727", base: "#d3a888", light: "#f4decd", "bright": "#FF9853a0" }

  marker_colors: &marker_colors # define alias for easier reference below
    EYFPG5A: *fcolors@yellow
    EYFP: *fcolors@yellow
    NEONGREEN: *fcolors@green
    EGFP: *fcolors@green
    EMGFP: *fcolors@green
    TAGGFP: *fcolors@green
    TAGBFP2: *fcolors@green
    MNG: *fcolors@green
    MNEONGREEN: *fcolors@green
    L0_G_MNEONGREEN: *fcolors@green
    EBFP: *fcolors@blue
    EBFP2: *fcolors@blue
    TAGBFP: *fcolors@blue
    SIRIUS: *fcolors@blue
    MKATE: *fcolors@red
    MKATE2: *fcolors@red
    MKO: *fcolors@red
    MKO2: *fcolors@red
    MORANGE: *fcolors@red
    TDTOMATO: *fcolors@red
    IRFP720: *fcolors@ir
    1XIRFP720: *fcolors@ir
    L0_G_IRFPMYSTERY: *fcolors@ir
    IRFP: *fcolors@ir
    MMAROON: *fcolors@maroon
    MMAROON1: *fcolors@maroon
    MPLUM: *fcolors@maroon

  ern_colors: &ern_colors # define alias
    CSY4: "#aaaaaa"
    CASE: "#cccccc"
    PGU: "#eeeeee"

  border_color: &border_color "#222222"
  text_color: &text_color "#222222"
  ern_interaction_color: &ern_int_color "#777" # used for connection color


!define theme: ${construct(&tvars)}

# Default GeneticPart
GeneticPart:
  color_remap:
    ${theme.input_main_marker_color}: "#aaaaaa"
    ${theme.input_secondary_marker_color}: *border_color
  Text:
    color: *text_color
    align: center
    font_size: 6
    offset.reference_relative: [0.45, 0.5]

Promoter:
  offset.relative: [0, .5]

Terminator:
  offset.relative: [.5, .5]
  style.margin: [0, 0, 0, -10]

ERN:
  layout.direction: row
  Text:
    color: *text_color
    align: center
    vertical_align: middle
    font_size: 9
    offset.reference_relative: [0.35, 0.5]


ERN5pRecog:
  offset.relative: [0, 0.4]
  offset.absolute: [0, 0.5]
  style.margin: [0, 2, 0, -4]

UorfGroup:
  style.margin: [0, 0, 0, -4]
  offset.relative: [0, 0.1]
  Text:
    offset.reference_relative: [0.5, -0.8]

!each(e) ${theme.ern_colors.items()}: # Loop through ERN types (CSY4, CASE, etc.)
  "ERN[part_name=~${e[0]}]": # Style ERN based on part name
    color_remap:
      ${theme.input_main_marker_color}: ${e[1]}
  "ERN5pRecog[part_name=~${e[0]}_rec]":
    color_remap:
      ${theme.input_main_marker_color}: ${e[1]}

# Fluorescent Marker Styling
!each(e) ${theme.marker_colors.items()}: # Loop through marker types
  FluoMarker[part_name=~${e[0]}]:
    color_remap:
      ${theme.input_main_marker_color}: ${e[1]['light']}
      ${theme.input_secondary_marker_color}: ${e[1]['base']}
    Text:
      color: ${e[1]['dark']}

  SourceAnnotation[marker=~${e[0]}]:
    style.border_color: ${e[1]['base']}
    Container[style_class=source_tag]: # Target the nested tag container
      style.background_color: ${e[1]['light']}
      style.border_color: ${e[1]['dark']}
      style.shadow: !jeanplot.models.Shadow
        color: "${e[1]['bright']}"
        blur_radius: 7
        resolution: 0.001

      SVGElement:
        color_remap:
           ${theme.input_main_marker_color}: ${e[1]['dark']}
      Text:
        color: ${e[1]['dark']}

TranscriptionUnit:
  line_thickness: 1
  line_color: *border_color
  # min_dimensions: [300, 0]
  layout.gap: 4
  Text:
    color: "#888888"
    font_size: 5
    offset.reference_relative: [0, 1.3]

SourceAnnotation:
  style.padding: [15, 15, 17, 15]
  style.border_color: *border_color
  style.border_width: 1
  style.corner_radius: 5
  style.border_style: custom
  style.dash_sequence: [3, 4]


Container[style_class=source_tag]:
  style.background_color: "#dddddd"
  style.border_color: *border_color
  style.border_width: 0.5
  style.corner_radius: 50
  style.padding: [3, 5, 3, 2]
  offset.relative: [0, -0.5]
  offset.absolute: [10, 0]
  layout.direction: row
  layout.align_items: center
  layout.justify_content: start
  layout.gap: 3
  SVGElement:
    offset.relative: [0, 0]
    style.margin: [0, 0, 0, 3]
    color_remap:
      ${theme.input_main_marker_color}: *border_color
  Text:
    color: *text_color
    font_size: 6

"[source_type=plasmid]":
  Container[style_class=source_tag]:
    SVGElement:
      transform.scale: [0.7, 0.7]

"[source_type=cotx]":
  Container[style_class=source_tag]:
    SVGElement:
      transform.scale: [0.9, 0.9]

NetworkGeneticSchematic:
  grid_gap: [50, 50] # Default gap, can be overridden in constructor
  style.padding: [5,5,5,5]

"[style_class=ern-anchor-top]":
  offset.reference_relative: [0.77, 1.1]
  min_segment: 25

"[style_class=ern-anchor-bottom]":
  offset.reference_relative: [0.77, -.1]
  min_segment: 12

"[style_class=ern-recog-anchor-top]":
  offset.reference_relative: [0.5, 1.1]
  min_segment: 15

"[style_class=ern-recog-anchor-bottom]":
  offset.reference_relative: [0.5, -0.2]
  min_segment: 5

Connection: # Default for all connections
  line_width: 1
  line_style: solid
  color: *ern_int_color # Default connection color
  end_cap.stroke_color: *ern_int_color # Match end cap color
  end_cap.stroke_width: 1.5
  end_cap.length: 8
Connection[style_class=connection_ERN]: # Specific style for ERN interactions
  line_width: 0.5

  # curve_type: !jeanplot.curve.SimpleBezierCurve
  #   start_mode: "vector"
  #   end_mode: "vector"

  curve_type: !jeanplot.curve.OrthogonalCurve
    corner_radius: 20

  # line_style: custom
  # dash_array: [2, 4]

Table:
  TableCell:
    style.padding: [7, 10, 7, 10]
    style.border_color: *border_color
    style.border_width: 0.5
    Text:
      align: center
      vertical_align: middle
  TableCell[style_class=table-header-cell]:
    style.background_color: "#eee"
    Text:
      font_weight: bold
