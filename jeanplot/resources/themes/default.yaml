!noconstruct theme_vars: &tvars
  input_main_marker_color:      &input_main "#0000ff"
  input_secondary_marker_color: &input_sec  "#00ff00"

  fluo_colors: &fcolors
    red:    { dark: "#840137", base: "#ef957d", light: "#ffe5de", bright: "#FF2C4944" }
    green:  { dark: "#0e633a", base: "#0FD2AE", light: "#efffdd", bright: "#0EFF7377" }
    blue:   { dark: "#406CA3", base: "#5DA1BB", light: "#f3fafd", bright: "#1AD5FF60" }
    yellow: { dark: "#836751", base: "#fad26d", light: "#FFF7D8", bright: "#FFC83Caa" }
    ir:     { dark: "#6c1772", base: "#df9ae4", light: "#ffe7f4", bright: "#FF82FCaa" }
    maroon: { dark: "#734727", base: "#d3a888", light: "#f4decd", bright: "#FF9853a0" }

  marker_colors: &marker_colors
    EYFPG5A:         *fcolors@yellow
    EYFP:            *fcolors@yellow
    NEONGREEN:       *fcolors@green
    EGFP:            *fcolors@green
    EMGFP:           *fcolors@green
    TAGGFP:          *fcolors@green
    TAGBFP2:         *fcolors@green
    MNG:             *fcolors@green
    MNEONGREEN:      *fcolors@green
    L0_G_MNEONGREEN: *fcolors@green
    EBFP:            *fcolors@blue
    EBFP2:           *fcolors@blue
    TAGBFP:          *fcolors@blue
    SIRIUS:          *fcolors@blue
    MKATE:           *fcolors@red
    MKATE2:          *fcolors@red
    MKO:             *fcolors@red
    MKO2:            *fcolors@red
    MORANGE:         *fcolors@red
    TDTOMATO:        *fcolors@red
    IRFP720:         *fcolors@ir
    1XIRFP720:       *fcolors@ir
    L0_G_IRFPMYSTERY: *fcolors@ir
    IRFP:            *fcolors@ir
    MMAROON:         *fcolors@maroon
    MMAROON1:        *fcolors@maroon
    MPLUM:           *fcolors@maroon

  ern_colors: &ern_colors
    CSY4: "#aaaaaa"
    CSY4_REC: "#aaaaaa"
    CASE: "#cccccc"
    CASE_REC: "#cccccc"
    PGU:  "#eeeeee"
    PGU_REC: "#eeeeee"

  neutral_swatch:  { dark: "#222",     base: "#222",     light: "transparent", bright: "transparent" }
  fluonode_swatch: { dark: "#222",     base: "#FFBB79",  light: "#FFBB79",     bright: "#FF8006" }

  border_color:          &border_color "#222"
  text_color:            &text_color   "#222"
  ern_interaction_color: &ern_int_color "#555"
  comp_connection_color: &comp_conn_color "#222"


!define theme: ${construct(&tvars)}

!import jeanplot.core.style: [palette_value]

!define marker_swatch: !fn
  !require channel: "swatch channel (dark/base/light/bright)"
  !live component:
    ${palette_value(component, theme.marker_colors, ['marker'],    theme.neutral_swatch, channel)}

!define part_swatch: !fn
  !require channel: "swatch channel (dark/base/light/bright)"
  !live component:
    ${palette_value(component, theme.marker_colors, ['part_name'], theme.neutral_swatch, channel)}

!define class_swatch: !fn
  !require channel: "swatch channel (dark/base/light/bright)"
  !live component:
    ${palette_value(component, theme.marker_colors, None,          theme.neutral_swatch, channel)}

!define fluo_swatch: !fn
  !require channel: "swatch channel (dark/base/light/bright)"
  !live component:
    ${palette_value(component, theme.marker_colors, None,          theme.fluonode_swatch, channel)}

!define ern_color: !fn
  !live component:
    ${palette_value(component, theme.ern_colors,    ['part_name'], '#999999')}


rules: !cascade:jstyle_fill
  Figure:
    <<: !include pkg:jeanplot:resources/themes/_figure_defaults.yaml@Figure

  GeneticPart:
    SVGElement:
      color_remap:
        "${theme.input_main_marker_color}":      "#aaaaaa"
        "${theme.input_secondary_marker_color}": ${theme.border_color}
    Text:
      color: ${theme.text_color}
      align: center
      font_size: 9
      offset: !Offset
        reference_relative: [0.35, 0.45]
        relative: [-0.5, -0.5]

  Promoter:
    offset: !Offset { relative: [0.2, 0.5], absolute: [-0.5, 0] }

  Terminator:
    offset: !Offset { relative: [0.3, 0.5] }
    style.margin: [0, 0, 0, -10]

  ERN:
    layout.direction: row
    SVGElement:
      color_remap:
        ${theme.input_main_marker_color}: !ern_color
    Text:
      align: center
      vertical_align: middle
      z_index: 10
      offset.absolute: [0, 0]

  ERN5pRecog:
    offset: !Offset { relative: [0.2, 0.38], absolute: [0, 0] }
    style.margin: [0, 2, 0, -4]
    SVGElement:
      color_remap:
        ${theme.input_main_marker_color}: !ern_color

  UorfGroup:
    style.margin: [0, 0, 0, -4]
    offset: !Offset { relative: [0, 0.1] }
    Text:
      font_size: 7
      offset: !Offset
        reference_relative: [0.2, -1.5]

  FluoMarker:
    SVGElement:
      color_remap:
        ${theme.input_main_marker_color}:      !part_swatch light
        ${theme.input_secondary_marker_color}: !part_swatch base
    Text:
      font_size: 7
      color: !part_swatch dark
      offset: !Offset 
        reference_relative: [0.45, 0.5] 
        relative: [-0.5, -0.5] 
      vertical_align: middle
      align: center

  TranscriptionUnit:
    line_thickness: 1
    line_color: ${theme.border_color}
    layout.gap: 4
    offset: !Offset { absolute: [5, 0] }
    Text:
      color: "#999"
      font_size: 8
      offset: !Offset { reference_relative: [0, 1.3] }
    Text[style_class=tu-label]:
      color: "#888888"
      font_size: 5
    Text[style_class=tu-ratio-label]:
      color: "#666666"
      font_size: 6
      font_weight: bold
      offset: !Offset { reference_relative: [0, 0.4], absolute: [-17, 0] }

  SourceAnnotation:
    style.padding: [18, 18, 20, 18]
    style.margin: [4, 20, 4, 4]
    style.border_color: !marker_swatch base
    style.border_width: 1
    style.corner_radius: 5
    style.border_style: custom
    style.dash_sequence: [3, 4]


  Container[style_class=source_tag]:
    style.background_color: !marker_swatch light
    style.border_color:     !marker_swatch dark
    style.border_width: 0.5
    style.corner_radius: 50
    style.padding: [3, 10, 3, 2]
    offset: !Offset { relative: [0, -0.5], absolute: [10, 0] }
    layout.direction: row
    layout.align_items: center
    layout.justify_content: start
    layout.gap: 3
    SVGElement:
      offset: !Offset { relative: [0, 0] }
      style.margin: [0, 0, 0, 3]
      color_remap:
        ${theme.input_main_marker_color}: !marker_swatch dark
    Text:
      color: !marker_swatch dark
      font_size: 7

  "[source_type=plasmid]":
    Container[style_class=source_tag]:
      SVGElement:
        transform.scale: [0.7, 0.7]

  "[source_type=cotx]":
    Container[style_class=source_tag]:
      SVGElement:
        transform.scale: [0.9, 0.9]

  GeneticSchematic:
    grid_gap: [40, 40]
    style.padding: [10, 10, 10, 10]

  FluoNode:
    style.border_color: "#00000030"
    style.background_color: !fluo_swatch light
    style.shadow:
      color: !fluo_swatch bright
      blur_radius: 15
      resolution: 0.01
    Text:
      color: !fluo_swatch dark
      font_size: 8
      vertical_align: middle
      align: center

  AggregationNode:
    style.background_color: !class_swatch light
    Text:
      color: "#222"
      font_size: 6
      vertical_align: middle
      align: center
      offset: !Offset { relative: [0, 2] }

  Text[style_class=tu_label_marker]:
    color: !class_swatch dark

  ComputeNode:
    min_dimensions: !Size { width: 18, height: 18 }
    style.corner_radius: 1.0e+6
    style.background_color: "#aaa"
    style.border_color: ${theme.comp_connection_color}
    style.border_width: 1
    style.margin: [10, 10, 10, 10]
    layout.align_items: center
    layout.justify_content: center
    Text:
      font_size: 7
      color: "#fff"
      vertical_align: middle
      align: center

  TranscriptionNode:
    style.background_color: "#555"

  TranslationNode:
    style.background_color: "#333"

  InputNode:
    style.background_color: "#222"
    Text: { color: "#fff" }
    style.shadow:
      color: !class_swatch bright
      blur_radius: 12
      resolution: 0.01

  BiasNode:
    style.background_color: "#bbb"
    Text: { color: "#444" }
    style.shadow:
      color: !class_swatch bright
      blur_radius: 12
      resolution: 0.01

  ERNNode:
    min_dimensions: !Size { width: 70, height: 70 }
    max_dimensions: !Size { width: 70, height: 70 }
    style.background_color: "#eee"
    style.border_style: custom
    style.dash_sequence: [5, 5]
    style.border_width: 1
    TranslationNode:
      style.background_color: "#ee3350"
      offset: !Offset { reference_relative: [0, 0.9], relative: [0, -1] }
    TranscriptionNode:
      offset: !Offset { reference_relative: [0, 0.1] }
    Connection[style_class=tlconn]:
      color: "#ee3350"
      line_width: 1
      start_offset: !Offset { relative: [1, 0.5] }
      end_offset: !Offset { absolute: [15, 3] }
      curve_type: !OrthogonalCurve
        start_direction: right
        end_direction: up
        start_length: 5
        end_length: 5
        corner_radius: 10
      z_index: -1
      end_cap: !LineEndFlat { stroke_color: "#ee3350", stroke_width: 1, length: 8 }
    Connection[style_class=txconn]:
      color: ${theme.comp_connection_color}
      line_width: 1
      z_index: -1
      curve_type: !SimpleBezierCurve
        start_mode: vector
        end_mode: vector
        start_vector: [15, 15]
        end_vector: [-40, 0]
      start_offset: !Offset { relative: [0.9, 0.8] }
    Text[style_class=ern_name]:
      color: "#888"
      font_size: 8
      vertical_align: middle
      align: center
      offset: !Offset { reference_relative: [0.5, 0.1], relative: [-0.5, 0] }
      is_overlay: true


  InvNode:
    style.background_color: "#eee"
    style.border_color: "#111"
    Text:
      color: ${theme.text_color}

  TUNode:
    min_dimensions: !Size { width: 15, height: 4 }
    max_dimensions: !Size { width: 15, height: 4 }
    style.background_color: "#111"
    style.border_width: 0
    style.margin: [0, 0, 0, 0]
    offset: !Offset {}
    style.shadow:
      color: !class_swatch bright
      blur_radius: 15
      resolution: 0.01
    Text:
      color: !class_swatch dark
      font_size: 6
      vertical_align: middle
      align: right
      is_overlay: true
      offset: !Offset { reference_relative: [0, 0], absolute: [-10, 0], relative: [-1, -0.3] }
    Container[style_class=tu_label_container]:
      offset: !Offset { reference_relative: [0, 0], absolute: [-10, 0], relative: [-1, -0.3] }
      Text[style_class=tu_label_prefix]:
        color: "#000000"
        font_size: 6
        vertical_align: middle
      Text[style_class=tu_label_suffix]:
        color: "#000000"
        font_size: 6
        vertical_align: middle
      Text[style_class=tu_label_marker]:
        font_size: 6
        vertical_align: middle

  TUNode[style_class=hidden_source]:
    is_overlay: true
    min_dimensions: !Size { width: 0.1, height: 0.1 }
    max_dimensions: !Size { width: 0.1, height: 0.1 }
    style.background_color: "#00000000"
    style.border_width: 0
    style.shadow: null
    offset: !Offset { reference_relative: [1.0, 0.5] }

  AggregationNode[!collapsed]:
    style.background_color: "#FFFFFFAA"
    style.border_color: "#FFA068"
    style.border_width: 0
    style.padding: [10, 4, 10, 4]
    layout: !LayoutConstraints { direction: column, justify_content: space-around, gap: 5 }
    TUNode:
      is_overlay: false

  AggregationNode[collapsed]:
    min_dimensions: !Size { width: 20, height: 4 }
    max_dimensions: !Size { width: 20, height: 4 }
    style.corner_radius: 3
    style.border_width: 0
    style.padding: [0, 0, 0, 0]
    style.background_color: "#000000"
    style.shadow:
      color: !class_swatch bright
      blur_radius: 10
      resolution: 0.01

  AggregationNode[collapsed][bias_connected]:
    TUNode:
      style.background_color: "#999"

  Container[style_class=input_layer]:
    style.padding: [0, 0, 0, 40]

  Text[style_class=legend_text]:
    font_size: 7
    vertical_align: middle
    align: right
    offset: !Offset { reference_relative: [2, 0], absolute: [0, 0], relative: [0, -0.3] }

  Text[style_class=marker_color_label]:
    font_size: 6
    vertical_align: top
    align: center
    attachment_offset: !Offset { reference_relative: [1, 0], relative: [-1, 0], absolute: [0, -12] }

  Container[style_class=ern_spacer]:
    min_dimensions: !Size { width: 70, height: 70 }
    max_dimensions: !Size { width: 70, height: 70 }
    style.margin: [10, 10, 10, 10]

  DeadEndNode:
    style.background_color: "#00000000"
    style.border_width: 0
    style.padding: [0, 0, 0, 0]
    Text:
      color: "#000000"
      font_size: 12
      vertical_align: middle
      align: center

  Connection[style_class=connection_ERN]:
    line_width: 0.5
    color: ${theme.ern_interaction_color}
    end_cap: !LineEndArrow
      stroke_color: ${theme.ern_interaction_color}
      stroke_width: 0.5
      length: 8

  Table:
    # Borders are a single collapsed grid (GridStyle), drawn once. Cells/rows carry no
    # borders — only padding, content and backgrounds. See jeanplot.core.table.GridStyle.
    grid:
      frame:
        color: ${theme.border_color}
        width: 0.6
      header:
        color: ${theme.border_color}
        width: 0.8
      inner:
        color: ${theme.border_color}
        width: 0.5
    TableCell:
      style.padding: [7, 10, 7, 10]
      Text: { align: center, vertical_align: middle }
    TableCell[style_class=table-header-cell]:
      style.background_color: "#eee"
      Text: { font_weight: bold }

  NetworkDiagram:
    layout.gap: 10
    layout.direction: row
    layout.align_items: center
    layout.justify_content: center
    thickness_range: [0.5, 2.5]
    embedding_thickness_map:
      tc_rate: { hef1a: 1 }
      tl_rate:
        None: 15
        1w_uorf: 10
        1x_uorf: 9
        2x_uorf: 8
        3x_uorf: 7
        4x_uorf: 6
        5x_uorf: 5
        6x_uorf: 4
        7x_uorf: 3
        8x_uorf: 2
        9x_uorf: 1

    Connection[style_class=comp-connection]:
      color: ${theme.comp_connection_color}
      line_width: 1
      start_offset: !Offset { reference_relative: [1, 0.5] }
      end_offset: !Offset { reference_relative: [0.0, 0.5], absolute: [0, 0] }
      curve_type: !SimpleBezierCurve
        start_mode: vector
        end_mode: vector
        start_vector: [25, 0]
        end_vector: [-10, 0]
      end_cap: !LineEndCircle
        fill_color: ${theme.comp_connection_color}
        stroke_width: 0
        radius: 1.5
        z-index: 10

    Connection[style_class=dst-deadend]:
      end_offset: !Offset { reference_relative: [0.5, 0.5] }

    Connection[style_class=dst-source]:
      end_offset: !Offset { reference_relative: [0.5, 0.5] }
      curve_type: !StraightCurve {}

    Connection[style_class=src-source]:
      curve_type: !SimpleBezierCurve
        start_mode: vector
        end_mode: vector
        start_vector: [30, 0]
        end_vector: [-25, 0]

    Container[style_class=layer]:
      layout.gap: 10
      layout.direction: column
      layout.align_items: center
      layout.justify_content: center

    Container[style_class=input_layer]:
      layout.gap: 15
      style.padding: [0, 0, 0, 0]

    Container[style_class=auto_layer]:
      style.padding: [0, 0, 0, 0]

    Container[style_class=output_layer]:
      style.padding: [0, 0, 0, 30]

    Container[style_class=main_layer]:
      layout.direction: column
      layout.align_items: center
      layout.justify_content: center
      style.margin: [0, 0, 0, 0]
      layout.gap: 20

    Text[style_class=layer_title]:
      color: "#999"
      font_size: 7

    ConnectionLabel[style_class=edge_annotation]:
      z_index: 10
      align_to_edge: true
      clip_connection: true
      clip_padding: 1.0

    ConnectionLabel[style_class=edge_ratio]:
      font_size: 5
      font_weight: normal
      color: "#222"
      halo: { color: "#00000000" }
      distance: 30
      relative: false
      align: left
      deny_text: "[(].1[)]"

    ConnectionLabel[style_class=edge_part]:
      font_size: 4
      font_weight: normal
      vertical_align: bottom
      color: "#222"
      halo: { color: "#00000000" }
      distance: -20
      relative: false
      align: right

    ConnectionLabel[style_class=embed-tc_rate]:
      deny_text: "hef1a"

  "[style_class=disabled]":
    opacity: 0.3
