# Higher-order figure templates: lift repeated figure shapes to one-line invocations.
#
# Use:
#   <<(<): !include pkg:jeanplot:resources/figures/templates
#   figure: !ComparePair { a: ${gt}, b: ${pred} }

<<(<): !include pkg:jeanplot:resources/templates/auto_panel
<<(<): !include pkg:jeanplot:resources/themes/plots

!define ComparePair: !fn
  !require a: "left PlotData"
  !require b: "right PlotData"
  !set_default title_a: "Ground Truth"
  !set_default title_b: "Predictions"
  !set_default output_dir: "./"
  !set_default file_prefix: ""
  !set_default file_suffix: "_compare.pdf"
  !fn :
    !Figure
      theme: !include pkg:jeanplot:resources/themes/plots.yaml@rules
      output_dir: ${output_dir}
      output_file: !default_output_name
        plot_data: ${b}
        fallback: "pred"
        prefix: ${file_prefix}
        suffix: ${file_suffix}
      layout: !LayoutConstraints
        direction: row
        gap: 8
      children:
        - !AutoPanel
          plot_data: ${a}
          title: ${title_a}
        - !AutoPanel
          plot_data: ${b}
          title: ${title_b}

!define Triple: !fn
  !require a: "left PlotData"
  !require b: "middle PlotData"
  !require c: "right PlotData"
  !set_default title_a: "A"
  !set_default title_b: "B"
  !set_default title_c: "C"
  !set_default output_dir: "./"
  !set_default output_file: "triple.pdf"
  !fn :
    !Figure
      theme: !include pkg:jeanplot:resources/themes/plots.yaml@rules
      output_dir: ${output_dir}
      output_file: ${output_file}
      layout: !LayoutConstraints
        direction: row
        gap: 8
      children:
        - !AutoPanel
          plot_data: ${a}
          title: ${title_a}
        - !AutoPanel
          plot_data: ${b}
          title: ${title_b}
        - !AutoPanel
          plot_data: ${c}
          title: ${title_c}

!define Row: !fn
  !require datas: "list[PlotData]"
  !set_default titles: null
  !set_default gap: 8.0
  !set_default output_dir: "./"
  !set_default output_file: "row.pdf"
  !fn :
    !Figure
      theme: !include pkg:jeanplot:resources/themes/plots.yaml@rules
      output_dir: ${output_dir}
      output_file: ${output_file}
      layout: !LayoutConstraints
        direction: row
        gap: ${gap}
      children:
        !each(d) ${list(enumerate(datas))}:
          - !AutoPanel
            plot_data: ${d[1]}
            title: ${titles[d[0]] if titles is not None and d[0] < len(titles) else None}
