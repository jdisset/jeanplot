!noconstruct theme_vars: &tvars
  fluo_colors: &fcolors
    red:
      dark: "#840137"
      base: "#ef957d"
      light: "#ffe5de"
    green:
      dark: "#0E633A"
      base: "#6CCB83"
      light: "#EFFFDD"
    blue:
      dark: "#006394"
      base: "#6cafc3"
      light: "#F3FAFD"
    yellow:
      dark: "#9B6600"
      base: "#FAD26D"
      light: "#FFF8B8"
    ir:
      dark: "#6c1772"
      base: "#df9ae4"
      light: "#ffe7f4"
    maroon:
      dark: "#734727"
      base: "#D3A888"
      light: "#F4DECD"

  marker_colors: # use capital letters for names
    EYFPG5A: *fcolors@yellow
    EYFP: *fcolors@yellow
    NEONGREEN: *fcolors@green
    MNEONGREEN: *fcolors@green
    L0_G_MNEONGREEN: *fcolors@green
    EBFP: *fcolors@blue
    EBFP2: *fcolors@blue
    TAGBFP: *fcolors@blue
    MKATE: *fcolors@red
    MKO2: *fcolors@red
    TDTOMATO: *fcolors@red
    IRFP720: *fcolors@ir
    1XIRFP720: *fcolors@ir
    L0_G_IRFPMYSTERY: *fcolors@ir
    IRFP: *fcolors@ir
    MMAROON: *fcolors@maroon
    MMAROON1: *fcolors@maroon

  ern_colors:
    CSY4: "#AAAAAA"
    CASE: "#CCCCCC"
    PGU: "#EEEEEE"

  border_color: "#222222"
  text_color: "#222222"

ERN:
  Text:
    color: "${&tvars.text_color}"
    align: center
    verticla_align: middle
    font_size: 9
    offset.relative: [-0.35, 0]

!define theme: ${construct(&tvars)}
!each(e) ${theme.ern_colors.items()}:
  ERN[part_name=~${e[0]}]:
    main_color: ${e[1]}
  ERN5pRecog[part_name=~${e[0]}*]:
    main_color: ${e[1]}

GeneticPart:
  main_color: "#aaaaaa"
  secondary_color: !include tvars@border_color

Source:
  style.margin: [8, 2, 8, 2]
  style.padding: [10, 10, 10, 10]
  style.border_color: !include tvars@border_color
  style.border_width: 0.5
  style.corner_radius: 5
  style.border_style: dashed

  layout.direction: column
  layout.align_items: center
  layout.justify_content: center
  layout.gap: 5

  Container[style_class=source_tag]:
    style.background_color: "#777777"
    style.border_color: !include tvars@border_color
    style.border_width: 0.5
    style.corner_radius: 50
    style.padding: [1.25, 5, 1.25, 2]

    offset.relative: [0, -0.5]
    offset.parent_relative: [0.1, 1]

    layout.direction: row
    layout.align_items: center
    layout.justify_content: start
    layout.gap: 3

    SVGElement:
      main_color: !include tvars@border_color
      offset.absolute: [0, 0.25]

    Text:
      color: !include tvars@text_color
      font_size: 5

Source[multi_type.stype=plasmid]:
  Container[style_class=source_tag]:
    SVGElement:
      transform.scale: [0.7, 0.7]
      main_color: "#00ff00"

Source[multi_type.stype=cotx]:
  Container[style_class=source_tag]:
    SVGElement:
      transform.scale: [0.9, 0.9]
      main_color: "#0000ff"

!each(e) "${theme['marker_colors'].items()}":
  Source[multi_type.marker=~${e[0]}]:
    style.border_color: ${e[1]['base']}
    Container[style_class=source_tag]:
      style.background_color: ${e[1]['light']}
      style.border_color: ${e[1]['dark']}
      SVGElement:
        main_color: ${e[1]['dark']}
      Text:
        color: ${e[1]['dark']}
